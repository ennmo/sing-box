name: Build Hardened Android AAR
on:
  workflow_dispatch:
    inputs:
      version_tag:
        required: true
        default: 'v1.13.14'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout specific version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version_tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Install GoMobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Fetch Go modules & Build AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GOPROXY: direct
        run: |
          go get golang.org/x/mobile@latest
          go mod tidy
          
          gomobile bind -v -target=android -androidapi=21 -javapkg=libbox ./experimental/libbox

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-${{ github.event.inputs.version_tag }}-aar
          path: ./*.aar
