name: Build Hardened Android AAR
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'v1.13.14'
        required: true
        default: 'v1.13.14'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout specific version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version_tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Install Official SagerNet GoMobile
        run: |
          go install github.com/sagernet/gomobile@latest
          gomobile init

      - name: Build AAR using official script
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GOPROXY: https://proxy.golang.org,direct
        run: |
          go run ./cmd/internal/build_libbox -target android

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-${{ github.event.inputs.version_tag }}-aar
          path: ./*.aar
